# All paths are relative to the directory snakemake is run from.

# --- Inputs ---------------------------------------------------------------
sra_dir: "sra"            # expects sra/SRRxxxxxxx/SRRxxxxxxx.sra (all found samples are used)
tmp_dir: "tmp_fastq"      # large scratch space for fasterq-dump / VIRGO2 input

host:
  fasta: "reference/GRCh38/GRCh38.primary_assembly.genome.fa"
  index: "reference/GRCh38/bowtie2/GRCh38"      # bowtie2 index prefix (built by the workflow)

# --- fastp ------------------------------------------------------------------
# Values follow the VIRGO2 methods (-l 50 -W 4 -M 20); --cut_tail activates window trimming.
fastp_qc: "--length_required 50 --cut_tail --cut_window_size 4 --cut_mean_quality 20"
trimmed_fastqc: false     # also run FastQC on trimmed reads (slower)

# --- HPV classification (after Ma et al. 2014, doi 10.1128/jvi.00093-14) --------
hpv:
  db: "reference/hpvrefs_db/hpv_db"             # BLAST db prefix (.nhr/.nin/.nsq)
  fasta: "reference/hpvrefs_db/hpv_all.fasta"   # defines the count-matrix columns
  min_pident: 95
  min_qcov: 1.0           # fraction of read covered (1.0 = full coverage)
  min_bitscore: 0
  max_evalue: 1.0e-10
  min_fragments: 1        # genotypes below this per sample are set to 0 (unfiltered matrix is also written)
  nonhost_norm: true      # also normalise per million non-human read pairs
  count_unit: "fragments" # "fragments" | "reads" | "reads_r1"
  tblastx_evalue: 1.0e-5  # choice of this workflow, not specified in the paper
  genbank:
    mode: "off"           # "off" | "remote" | "local"  (keep the quotes: bare off is read as false)
    db: "nt"              # remote db name, or path of a local BLAST db
    evalue: 1.0e-5        # choice of this workflow, not specified in the paper
    batch: 50             # reads per remote request
    sleep: 15             # seconds between remote requests

# --- VIRGO2 ------------------------------------------------------------------
virgo2:
  home: "reference/VIRGO2"
  annotate: true
  annot_min_total_count: 1
  annot_table_ids: [0, 1, 3, 4, 5, 6, 7, 8, 9, 10, 11]

# --- VISTA ---------------------------------------------------------------------
vista:
  home: "reference/VISTA"
  archive: "reference/VISTA_data.tar.gz"        # manual download is used if present
  data_url: "https://figshare.com/ndownloader/files/62956279"
